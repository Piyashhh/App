<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puja Location Auditor</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f5f5f5;color:#171717}header{background:#171717;color:white;padding:14px;position:sticky;top:0}h1{font-size:18px;margin:0}.sub{font-size:12px;opacity:.7}main{max-width:760px;margin:auto;padding:14px}.panel{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;margin-bottom:12px}button{border:0;border-radius:8px;padding:11px 13px;font-weight:650;background:#171717;color:white}button.secondary{background:#eee;color:#171717}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{color:#555;margin:8px 0}.progress{height:8px;background:#ddd;border-radius:9px;overflow:hidden}.progress div{height:100%;background:#171717}.search,input[type=text]{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font:inherit}.list{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto;margin-top:10px}.entry{text-align:left;background:#fafafa;color:#171717;border:1px solid #ddd}.entry.done{border-left:5px solid #176b3a}.entry small{display:block;color:#666;margin-top:3px}.loc{display:flex;flex-direction:column;gap:8px}.loc button{text-align:left}.loc span{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:3px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice button{background:#eee;color:#171717}.choice button.selected{background:#176b3a;color:#fff}label{display:block;font-weight:650;margin:12px 0 6px}.muted{font-size:12px;color:#666}.notice{padding:10px;background:#eee;border-radius:8px}.hidden{display:none!important}hr{border:0;border-top:1px solid #ddd;margin:14px 0}</style></head><body><header><h1>Puja Location Auditor</h1><div class="sub">Local autosave · Excel in / Excel out</div></header><main><section id="home"><div class="panel"><div id="resume" class="notice hidden"></div><label>Load Excel dataset</label><input id="file" type="file" accept=".xlsx,.xls,.csv"><div class="muted" style="margin-top:8px">Progress is saved immediately on this device.</div></div><div id="work" class="hidden"><div id="stats" class="stats"></div><div class="progress"><div id="bar" style="width:0"></div></div><div class="actions" style="margin-top:12px"><button onclick="exportFile()">Export audited Excel</button><button class="secondary" onclick="clearAudit()">Clear saved audit</button></div><label>Search</label><input id="search" class="search" placeholder="Search puja, club, area or address"><div class="actions" style="margin-top:9px"><button class="secondary" onclick="setFilter('all')">All</button><button class="secondary" onclick="setFilter('open')">Not audited</button><button class="secondary" onclick="setFilter('done')">Audited</button><button class="secondary" onclick="setFilter('corrected')">Corrected</button></div><div id="list" class="list"></div></div></section><section id="detail" class="hidden"><button class="secondary" onclick="showHome()">← Back</button><div class="panel"><h2 id="title" style="font-size:18px;margin:12px 0 4px"></h2><div id="meta" class="muted"></div><div id="locs" class="loc" style="margin-top:12px"></div><hr><label>Which location is correct?</label><div id="choices" class="choice"></div><label>Or enter the correct Google Maps link</label><input id="corrected" type="text" placeholder="Paste Google Maps link"><div class="actions" style="margin-top:12px"><button onclick="saveDecision()">Save & next</button><button class="secondary" onclick="saveAndStay()">Save</button></div><div id="saved" class="muted" style="margin-top:8px"></div></div></section></main><script>
let rows=[],headers=[],current=-1,filter='all',audit={},storageKey='',fileName='dataset.xlsx';
const A={name:['Puja Name','Name'],club:['Club Name','Committee Name','Club','Committee'],maps:['Google Maps URL','Google Maps Link','Google Map URL'],d1lat:['D1 Latitude'],d1lon:['D1 Longitude'],d2lat:['D2 Latitude'],d2lon:['D2 Longitude'],d4lat:['D4 Latitude'],d4lon:['D4 Longitude'],d4maps:['D4 Gmaps Link','D4 Google Maps Link']};
function col(a){for(let x of a){let h=headers.find(h=>String(h).trim().toLowerCase()==x.toLowerCase());if(h)return h}return null}function val(r,a){let c=col(a);return c==null?'':(r[c]??'')}function link(lat,lon){if(lat===''||lon==='')return '';return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(lat+','+lon)}function key(r,i){for(let f of ['Puja ID','Puja Code','Pandal ID'])if(String(r[f]??'').trim())return 'id:'+String(r[f]).trim();return 'row:'+i+'|'+val(r,A.name)+'|'+val(r,['Address'])}function load(){try{audit=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){audit={}}}function save(){localStorage.setItem(storageKey,JSON.stringify(audit))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stats(){let n=rows.length,d=Object.keys(audit).filter(k=>audit[k]?.status).length;document.getElementById('stats').textContent=`${d} / ${n} audited · ${n?Math.round(d/n*100):0}%`;document.getElementById('bar').style.width=(n?d/n*100:0)+'%'}function render(){let q=document.getElementById('search').value.toLowerCase(),list=document.getElementById('list');list.innerHTML='';rows.forEach((r,i)=>{let a=audit[key(r,i)]||{},text=Object.values(r).join(' ').toLowerCase();if(q&&!text.includes(q))return;if(filter==='open'&&a.status)return;if(filter==='done'&&!a.status)return;if(filter==='corrected'&&a.status!=='corrected')return;let b=document.createElement('button');b.className='entry '+(a.status?'done':'');b.onclick=()=>openEntry(i);b.innerHTML='<strong>'+esc(val(r,A.name)||'Unnamed entry')+'</strong><small>'+esc(val(r,A.club)||val(r,['Area'])||val(r,['Address'])||'')+'</small>'+(a.status?'<small>✓ '+esc(a.source||a.status)+'</small>':'');list.appendChild(b)});stats()}function setFilter(x){filter=x;render()}document.getElementById('search').oninput=render;
function openEntry(i){current=i;let r=rows[i],k=key(r,i),a=audit[k]||{};document.getElementById('home').classList.add('hidden');document.getElementById('detail').classList.remove('hidden');document.getElementById('title').textContent=val(r,A.name)||'Unnamed entry';document.getElementById('meta').textContent=[val(r,A.club),val(r,['Area']),val(r,['Address'])].filter(Boolean).join(' · ');let ls=[['Google Maps',val(r,A.maps)],['D1',link(val(r,A.d1lat),val(r,A.d1lon))],['D2',link(val(r,A.d2lat),val(r,A.d2lon))],['D4',val(r,A.d4maps)||link(val(r,A.d4lat),val(r,A.d4lon))]];let box=document.getElementById('locs');box.innerHTML='';ls.forEach(([n,u])=>{if(!u)return;let b=document.createElement('button');b.innerHTML=n+'<span>'+esc(u)+'</span>';b.onclick=()=>window.open(u,'_blank');box.appendChild(b)});let ch=document.getElementById('choices');ch.innerHTML='';['Google Maps','D1','D2','D4'].forEach(n=>{let b=document.createElement('button');b.textContent=n;if(a.source===n)b.classList.add('selected');b.onclick=()=>{a.source=n;a.status='verified';audit[k]=a;save();ch.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('corrected').value='';document.getElementById('saved').textContent='Saved locally ✓';stats()};ch.appendChild(b)});document.getElementById('corrected').value=a.correctedLink||'';document.getElementById('saved').textContent=a.status?'Saved locally':'Not yet audited'}
function persist(){let r=rows[current],k=key(r,current),a=audit[k]||{},c=document.getElementById('corrected').value.trim();if(c){a.status='corrected';a.source='Corrected link';a.correctedLink=c}else if(!a.source){alert('Select a location or enter a corrected link.');return false}else{a.status='verified';a.correctedLink=''}a.timestamp=new Date().toISOString();audit[k]=a;save();return true}function saveAndStay(){if(persist())document.getElementById('saved').textContent='Saved locally ✓'}function saveDecision(){if(!persist())return;let n=rows.findIndex((_,i)=>i>current&&!audit[key(rows[i],i)]?.status);if(n<0)n=rows.findIndex((_,i)=>!audit[key(rows[i],i)]?.status);if(n>=0)openEntry(n);else{showHome();alert('All entries are audited. Export the Excel when ready.')}}function showHome(){document.getElementById('detail').classList.add('hidden');document.getElementById('home').classList.remove('hidden');render()}
function exportFile(){let out=rows.map((r,i)=>{let x={...r},a=audit[key(r,i)]||{};x['Verified Location Source']=a.source||'';x['Verified Google Maps Link']=a.correctedLink||({ 'Google Maps':val(r,A.maps),'D1':link(val(r,A.d1lat),val(r,A.d1lon)),'D2':link(val(r,A.d2lat),val(r,A.d2lon)),'D4':val(r,A.d4maps)||link(val(r,A.d4lat),val(r,A.d4lon))}[a.source]||'');x['Location Verification Status']=a.status||'';x['Location Verified At']=a.timestamp||'';return x});let ws=XLSX.utils.json_to_sheet(out),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Audited');XLSX.writeFile(wb,fileName.replace(/\.[^.]+$/,'')+' - audited.xlsx')}
function clearAudit(){if(confirm('Delete saved audit progress for this workbook on this device?')){localStorage.removeItem(storageKey);audit={};render()}}
document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;fileName=f.name;let rd=new FileReader();rd.onload=x=>{let wb=XLSX.read(x.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''});headers=rows.length?Object.keys(rows[0]):[];storageKey='puja-audit:'+fileName+':'+rows.length+':'+headers.join('|');load();document.getElementById('work').classList.remove('hidden');render();let d=Object.keys(audit).filter(k=>audit[k]?.status).length;if(d)document.getElementById('resume').classList.remove('hidden'),document.getElementById('resume').textContent=`Saved audit found: ${d} entries already completed. Your progress has been restored.`};rd.readAsArrayBuffer(f)};
</script></body></html>
